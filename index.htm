
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

.screen {
    display: none;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
}

.active {
    display: flex;
}

h1 {
    font-size: 42px;
    letter-spacing: 3px;
}

button {
    width: 190px;
    padding: 15px;
    margin: 10px;
    background: #111;
    color: white;
    border: 2px solid white;
    border-radius: 8px;
    font-size: 19px;
    cursor: pointer;
}

button:active {
    background: #444;
}

.info-text {
    line-height: 2.2;
    font-size: 18px;
}

canvas {
    background: #080808;
    max-width: 100%;
    touch-action: none;
    border: 1px solid #333;
}

.small {
    color: #888;
    font-size: 13px;
}
</style>
</head>

<body>

<!-- MAIN MENU -->
<div id="menu" class="screen active">
    <h1>FLAPPY BIRD</h1>
    <button onclick="startGame()">START</button>
    <button onclick="showInfo()">INFO</button>
</div>

<!-- INFORMATION -->
<div id="info" class="screen">
    <h1>INFO</h1>
    <div class="info-text">
        <p>Programmer: Abdullah</p>
        <p>Experience: Beginner</p>
    </div>
    <button onclick="showMenu()">BACK</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
    <h2 id="score">Score: 0</h2>
    <canvas id="canvas" width="360" height="520"></canvas>
    <p class="small">TAP THE SCREEN TO FLY</p>
    <button id="restart" onclick="startGame()" style="display:none">
        PLAY AGAIN
    </button>
    <button onclick="showMenu()">MENU</button>
</div>

<script>
const menu = document.getElementById("menu");
const info = document.getElementById("info");
const game = document.getElementById("game");

function showScreen(screen) {
    menu.classList.remove("active");
    info.classList.remove("active");
    game.classList.remove("active");
    screen.classList.add("active");
}

function showMenu() {
    showScreen(menu);
    running = false;
}

function showInfo() {
    showScreen(info);
}

// GAME ENGINE

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let bird, pipes, score, running;
let frame;

function startGame() {
    showScreen(game);

    bird = {
        x: 75,
        y: 220,
        velocity: 0,
        radius: 12
    };

    pipes = [];
    score = 0;
    frame = 0;
    running = true;

    document.getElementById("score").textContent = "Score: 0";
    document.getElementById("restart").style.display = "none";

    cancelAnimationFrame(animation);
    loop();
}

let animation;

function flap() {
    if (running) {
        bird.velocity = -5.5;
    }
}

canvas.addEventListener("pointerdown", flap);

function createPipe() {
    let gap = 145;
    let top = Math.random() * 220 + 35;

    pipes.push({
        x: canvas.width,
        top: top,
        bottom: top + gap,
        passed: false
    });
}

function drawBird() {
    ctx.fillStyle = "#FFD43B";
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(bird.x + 5, bird.y - 4, 2, 0, Math.PI * 2);
    ctx.fill();
}

function drawPipes() {
    ctx.fillStyle = "#36C759";

    pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, 48, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, 48,
                     canvas.height - pipe.bottom);
    });
}

function endGame() {
    running = false;
    document.getElementById("restart").style.display = "block";

    ctx.fillStyle = "white";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 180, 250);
}

function loop() {
    if (!running) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    frame++;

    bird.velocity += 0.28;
    bird.y += bird.velocity;

    if (frame % 100 === 0) createPipe();

    pipes.forEach(pipe => {
        pipe.x -= 2.5;

        if (!pipe.passed && pipe.x + 48 < bird.x) {
            pipe.passed = true;
            score++;
            document.getElementById("score").textContent =
                "Score: " + score;
        }

        let collisionX =
            bird.x + bird.radius > pipe.x &&
            bird.x - bird.radius < pipe.x + 48;

        let collisionY =
            bird.y - bird.radius < pipe.top ||
            bird.y + bird.radius > pipe.bottom;

        if (collisionX && collisionY) endGame();
    });

    pipes = pipes.filter(pipe => pipe.x > -50);

    drawPipes();
    drawBird();

    if (bird.y > canvas.height || bird.y < 0) {
        endGame();
    }

    if (running) {
        animation = requestAnimationFrame(loop);
    }
}

document.addEventListener("keydown", event => {
    if (event.code === "Space" && game.classList.contains("active")) {
        event.preventDefault();
        flap();
    }
});
</script>

</body>
</html>
