<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Flappy Bird</title>
<style>
  /* ---------------------------------------------------------
     BASE / LAYOUT
     --------------------------------------------------------- */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #app {
    position: relative;
    width: 100%;
    max-width: calc(100vh * 0.5625);
    max-width: calc(100dvh * 0.5625);
    aspect-ratio: 360 / 640;
    background: #000;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------------------------------------------------------
     OVERLAY SCREENS
     --------------------------------------------------------- */
  .screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    background: #000;
  }

  .screen.hidden {
    display: none;
  }

  #gameoverScreen {
    background: rgba(0, 0, 0, 0.85);
  }

  /* ---------------------------------------------------------
     BUTTONS & TEXT
     --------------------------------------------------------- */
  button {
    font-family: inherit;
    font-size: 18px;
    letter-spacing: 2px;
    color: #fff;
    background: transparent;
    border: 2px solid #fff;
    border-radius: 10px;
    padding: 14px 40px;
    min-width: 180px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.08s ease;
  }

  @media (hover: hover) {
    button:hover {
      background: #fff;
      color: #000;
    }
  }

  button:active {
    transform: scale(0.95);
  }

  .title {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 3px;
  }

  .score-line {
    margin: 0;
    font-size: 20px;
    letter-spacing: 1px;
  }

  .score-line span {
    font-weight: 700;
    color: #ffd93d;
  }

  /* ---------------------------------------------------------
     INFO SCREEN – static Arabic panel
     --------------------------------------------------------- */
  #infoScreen {
    background: #000;
  }

  .info-card {
    width: 100%;
    max-width: 300px;
    border: 2px solid #fff;
    border-radius: 16px;
    padding: 26px 22px;
    background: #0d1117;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    direction: rtl;
  }

  .info-card p {
    margin: 0;
    font-size: 18px;
    line-height: 1.6;
    letter-spacing: 0.5px;
    color: #ffffff;
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
  }

  .info-card p span {
    font-weight: 700;
    color: #ffd93d;
  }

  .info-card .divider {
    width: 60%;
    height: 1px;
    background: #30363d;
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="game"></canvas>

  <!-- ===== MAIN MENU ===== -->
  <div id="menuScreen" class="screen">
    <button id="startBtn" type="button">START</button>
    <button id="infoBtn" type="button">INFO</button>
  </div>

  <!-- ===== INFO SCREEN (static Arabic panel) ===== -->
  <div id="infoScreen" class="screen hidden">
    <div class="info-card">
      <p>المبرمج: <span>عبدالله جهاد</span></p>
      <div class="divider"></div>
      <p>العمر: <span>16</span></p>
      <div class="divider"></div>
      <p>الخبرات: <span>بسيطة</span></p>
    </div>
    <button id="backBtn" type="button">BACK</button>
  </div>

  <!-- ===== GAME OVER SCREEN ===== -->
  <div id="gameoverScreen" class="screen hidden">
    <h1 class="title">GAME OVER</h1>
    <p class="score-line">Score: <span id="finalScore">0</span></p>
    <button id="againBtn" type="button">PLAY AGAIN</button>
    <button id="menuBtn" type="button">MENU</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. CONSTANTS
     ========================================================= */
  const W = 360;
  const H = 640;
  const GROUND_H = 70;

  const GRAVITY = 0.45;
  const FLAP = -7.2;
  const BIRD_X = 90;
  const BIRD_R = 14;
  const HIT_R = 12;

  const PIPE_W = 62;
  const PIPE_SPEED = 2.2;
  const PIPE_SPACING = 210;
  const GAP = 150;
  const GAP_MARGIN = 70;

  const COLORS = {
    bg:         '#0d1117',
    ground:     '#161b22',
    groundLine: '#30363d',
    pipe:       '#3ecf4a',
    pipeLight:  'rgba(255,255,255,0.18)',
    pipeDark:   'rgba(0,0,0,0.25)',
    pipeBorder: '#1d7a26',
    bird:       '#ffd93d',
    birdBorder: '#c9a227',
    beak:       '#ff8c1a'
  };

  /* =========================================================
     2. GAME STATE
     ========================================================= */
  const STATE = { MENU: 'menu', INFO: 'info', PLAYING: 'playing', OVER: 'over' };
  let state = STATE.MENU;

  let score = 0;
  let pipes = [];
  const bird = { x: BIRD_X, y: H / 2, vy: 0, angle: 0 };

  let running = false;
  let rafId = null;
  let lastTime = 0;

  /* =========================================================
     3. DOM REFERENCES
     ========================================================= */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const menuScreen     = document.getElementById('menuScreen');
  const infoScreen     = document.getElementById('infoScreen');
  const gameoverScreen = document.getElementById('gameoverScreen');
  const finalScoreEl   = document.getElementById('finalScore');

  const screens = {
    menu: menuScreen,
    info: infoScreen,
    over: gameoverScreen
  };

  /* =========================================================
     4. CANVAS SIZING
     ========================================================= */
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const pxW = Math.max(1, Math.round(rect.width * dpr));
    const pxH = Math.max(1, Math.round(rect.height * dpr));

    if (canvas.width !== pxW || canvas.height !== pxH) {
      canvas.width = pxW;
      canvas.height = pxH;
    }

    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }

  /* =========================================================
     5. SCREEN HELPERS
     ========================================================= */
  function showScreen(name) {
    for (const key in screens) {
      screens[key].classList.add('hidden');
    }
    if (name && screens[name]) {
      screens[name].classList.remove('hidden');
    }
  }

  /* =========================================================
     6. GAME LOOP
     ========================================================= */
  function startLoop() {
    if (running) return;
    running = true;
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function stopLoop() {
    running = false;
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  function loop(now) {
    if (!running) return;

    let dt = (now - lastTime) / (1000 / 60);
    lastTime = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 3) dt = 3;

    update(dt);
    render();

    if (running) {
      rafId = requestAnimationFrame(loop);
    }
  }

  /* =========================================================
     7. GAME SETUP / RESET
     ========================================================= */
  function spawnPipe(x) {
    const minGapY = GAP_MARGIN + GAP / 2;
    const maxGapY = H - GROUND_H - GAP_MARGIN - GAP / 2;
    const gapY = minGapY + Math.random() * (maxGapY - minGapY);

    pipes.push({ x: x, gapY: gapY, scored: false });
  }

  function resetGame() {
    bird.x = BIRD_X;
    bird.y = H / 2 - 60;
    bird.vy = 0;
    bird.angle = 0;

    pipes = [];
    score = 0;

    spawnPipe(W + 80);
  }

  function startGame() {
    resetGame();
    state = STATE.PLAYING;
    showScreen(null);
    startLoop();
  }

  function goToMenu() {
    stopLoop();
    state = STATE.MENU;
    showScreen('menu');
  }

  function gameOver() {
    stopLoop();
    state = STATE.OVER;
    finalScoreEl.textContent = String(score);
    showScreen('over');
  }

  /* =========================================================
     8. UPDATE (game logic)
     ========================================================= */
  function update(dt) {
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;

    let angle = bird.vy / 14;
    if (angle < -0.5) angle = -0.5;
    if (angle > 1.0) angle = 1.0;
    bird.angle = angle;

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= PIPE_SPEED * dt;

      if (!p.scored && p.x + PIPE_W < bird.x) {
        p.scored = true;
        score++;
      }

      if (p.x + PIPE_W < -20) {
        pipes.splice(i, 1);
      }
    }

    const lastPipe = pipes[pipes.length - 1];
    if (!lastPipe || lastPipe.x < W - PIPE_SPACING) {
      spawnPipe(W);
    }

    if (bird.y - HIT_R <= 0) {
      bird.y = HIT_R;
      gameOver();
      return;
    }

    if (bird.y + HIT_R >= H - GROUND_H) {
      bird.y = H - GROUND_H - HIT_R;
      gameOver();
      return;
    }

    for (let i = 0; i < pipes.length; i++) {
      const p = pipes[i];
      const gapTop = p.gapY - GAP / 2;
      const gapBottom = p.gapY + GAP / 2;

      if (circleHitsRect(bird.x, bird.y, HIT_R, p.x, 0, PIPE_W, gapTop)) {
        gameOver();
        return;
      }
      if (circleHitsRect(bird.x, bird.y, HIT_R, p.x, gapBottom, PIPE_W, H - GROUND_H - gapBottom)) {
        gameOver();
        return;
      }
    }
  }

  function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
    if (rw <= 0 || rh <= 0) return false;
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < (r * r);
  }

  /* =========================================================
     9. RENDER
     ========================================================= */
  function render() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < pipes.length; i++) {
      const p = pipes[i];
      const gapTop = p.gapY - GAP / 2;
      const gapBottom = p.gapY + GAP / 2;

      drawPipe(p.x, 0, PIPE_W, gapTop);
      drawPipe(p.x, gapBottom, PIPE_W, H - GROUND_H - gapBottom);
    }

    ctx.fillStyle = COLORS.ground;
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = COLORS.groundLine;
    ctx.fillRect(0, H - GROUND_H, W, 4);

    drawBird();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px system-ui, -apple-system, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(score), W / 2, 62);
  }

  function drawPipe(x, y, w, h) {
    if (h <= 0) return;

    ctx.fillStyle = COLORS.pipe;
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = COLORS.pipeLight;
    ctx.fillRect(x + 7, y, 9, h);

    ctx.fillStyle = COLORS.pipeDark;
    ctx.fillRect(x + w - 11, y, 11, h);

    ctx.strokeStyle = COLORS.pipeBorder;
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.angle);

    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.fillStyle = COLORS.bird;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = COLORS.birdBorder;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(5, -5, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(6.5, -5, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = '#111111';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(BIRD_R - 3, 1);
    ctx.lineTo(BIRD_R + 8, 5);
    ctx.lineTo(BIRD_R - 3, 9);
    ctx.closePath();
    ctx.fillStyle = COLORS.beak;
    ctx.fill();

    ctx.restore();
  }

  /* =========================================================
     10. INPUT
     ========================================================= */
  function flap() {
    if (state !== STATE.PLAYING) return;
    bird.vy = FLAP;
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    flap();
  });

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    flap();
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      flap();
    }
  });

  /* =========================================================
     11. BUTTONS
     ========================================================= */
  document.getElementById('startBtn').addEventListener('click', startGame);

  document.getElementById('infoBtn').addEventListener('click', function () {
    state = STATE.INFO;
    showScreen('info');
  });

  document.getElementById('backBtn').addEventListener('click', function () {
    state = STATE.MENU;
    showScreen('menu');
  });

  document.getElementById('againBtn').addEventListener('click', startGame);

  document.getElementById('menuBtn').addEventListener('click', goToMenu);

  /* =========================================================
     12. INIT
     ========================================================= */
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', resizeCanvas);

  resizeCanvas();
  showScreen('menu');
  render();

})();
</script>

</body>
</html>
