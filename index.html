
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنجازاتي | My Achievements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #222;
            margin: 0;
            padding: 30px 15px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            color: #3157a4;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
            box-shadow: 0 3px 12px #00000010;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #3157a4;
        }

        button {
            background: #3157a4;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>إنجازاتي</h1>
    <p>كل إنجاز صغير هو خطوة نحو هدف أكبر.</p>

    <div class="card">
        <h2>ملخص إنجازاتك</h2>
        <div class="stats">
            <div>
                <div class="number">0</div>
                <p>الإنجازات</p>
            </div>
            <div>
                <div class="number">0</div>
                <p>الأهداف</p>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>ابدأ رحلتك</h2>
        <p>سجل أهدافك، وثّق إنجازاتك، وتابع تقدمك.</p>
        <button>إضافة إنجاز</button>
        <button>إضافة هدف</button>
    </div>
</div>

</body>
</html>
